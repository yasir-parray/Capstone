apiVersion: v1
kind: Namespace
metadata:
  name: project-14
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: project14-page
  namespace: project-14
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Project 14 - EKS</title>
    </head>
    <body>
      <h1>Project 14: App Deployment using EKS</h1>
      <p>The application is running on Amazon EKS.</p>
      <h4> Yasir Mohi ud din</h4>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project14-web
  namespace: project-14
spec:
  replicas: 1
  selector:
    matchLabels:
      app: project14-web
  template:
    metadata:
      labels:
        app: project14-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: page
          configMap:
            name: project14-page
---
apiVersion: v1
kind: Service
metadata:
  name: project14-web
  namespace: project-14
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "Project=Project_14"
spec:
  type: LoadBalancer
  selector:
    app: project14-web
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
